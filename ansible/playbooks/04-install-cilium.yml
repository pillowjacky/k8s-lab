---
- name: Install Cilium CNI
  hosts: masters
  gather_facts: false

  tasks:
    - name: Check if cilium CLI is already present
      ansible.builtin.stat:
        path: /usr/local/bin/cilium
      register: cilium_bin

    - name: Download and extract Cilium CLI
      ansible.builtin.unarchive:
        src: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
      when: not cilium_bin.stat.exists

    - name: Verify Cilium CLI
      ansible.builtin.command: cilium version --client
      register: cilium_client
      changed_when: false

    - name: Show Cilium CLI version
      ansible.builtin.debug:
        var: cilium_client.stdout_lines

    # ------------------------------------------------------------------
    # Install Cilium itself
    # ------------------------------------------------------------------
    - name: Check if Cilium is already installed
      ansible.builtin.command: cilium status --wait=false
      register: cilium_status
      failed_when: false
      changed_when: false

    - name: Install Cilium
      when: cilium_status.rc != 0
      ansible.builtin.command: >
        cilium install
        --version {{ cilium_version }}
        --set k8sServiceHost={{ control_plane_ip }}
        --set k8sServicePort=6443
        --set ipam.mode=kubernetes
        --set gatewayAPI.enabled={{ enable_gateway_api | lower }}
        --set hubble.relay.enabled={{ enable_hubble | lower }}
        --set hubble.ui.enabled={{ enable_hubble | lower }}
        --set kubeProxyReplacement={{ kube_proxy_replacement | lower }}
        --set l2announcements.enabled={{ enable_l2_announcements | lower }}
      register: cilium_install

    - name: Wait for Cilium to become healthy
      ansible.builtin.command: cilium status --wait
      register: cilium_ready
      retries: 20
      delay: 15
      until: cilium_ready.rc == 0
      changed_when: false

    - name: Show final Cilium status
      ansible.builtin.command: cilium status
      register: final_status
      changed_when: false

    - name: Print Cilium status
      ansible.builtin.debug:
        var: final_status.stdout_lines

    # ------------------------------------------------------------------
    # Quick verification helpers
    # ------------------------------------------------------------------
    - name: Confirm kube-proxy is NOT running
      ansible.builtin.command: kubectl -n kube-system get pods -l k8s-app=kube-proxy
      register: kube_proxy_pods
      changed_when: false
      failed_when: false

    - name: kube-proxy should be absent
      ansible.builtin.debug:
        msg: "kube-proxy pods (should be empty): {{ kube_proxy_pods.stdout }}"

    - name: List nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
