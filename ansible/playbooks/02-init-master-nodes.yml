---
- name: Initialise Kubernetes control-plane
  hosts: masters
  gather_facts: true
  vars:
    kubeadm_config_src: kubeadm-config.yaml.j2
    kubeadm_config_dest: /tmp/kubeadm-config.yaml

  tasks:
    - name: Check whether cluster is already initialised
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Render and copy kubeadm configuration to master
      ansible.builtin.template:
        src: "{{ kubeadm_config_src }}"
        dest: "{{ kubeadm_config_dest }}"
        mode: "0644"
      when: not admin_conf.stat.exists

    - name: Run kubeadm init (skip if already done)
      ansible.builtin.command: >
        kubeadm init
        --config={{ kubeadm_config_remote }}
        --upload-certs
      register: kubeadm_init
      when: not admin_conf.stat.exists
      changed_when: true

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0755"

    - name: Copy admin.conf to root's kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

    - name: Wait for API server to be ready
      ansible.builtin.command: kubectl get --raw='/readyz'
      register: apiserver_ready
      until: apiserver_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false
