---
- name: Generate join command on Master
  hosts: masters
  gather_facts: false
  tasks:
    - name: Generate a fresh join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: raw_join_command
      changed_when: false

    - name: Save join command as host fact
      ansible.builtin.set_fact:
        join_command: "{{ raw_join_command.stdout }}"

    - name: Show the join command
      ansible.builtin.debug:
        var: join_command

- name: Execute join on workers
  hosts: workers
  gather_facts: false
  tasks:
    - name: Check if node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join the cluster
      ansible.builtin.command: "{{ hostvars[groups['masters'][0]].join_command }}"
      when: not kubelet_conf.stat.exists
      register: join_result

    - name: Show join result
      ansible.builtin.debug:
        var: join_result.stdout_lines
      when: join_result is defined and join_result.stdout_lines is defined
